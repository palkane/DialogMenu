default-layout: layout-demo
# 服务器统一资源目标版本；修改后执行 /dialogmenu reload all，不按玩家版本切换。
# 支持 1.21.7/8/9/10/11、26.1/26.1.1/26.1.2、26.2、26.3。
resource-version: '26.3'
canvas-width: 300
max-canvas-pixels: 1048576
# 默认允许 Esc 关闭；单个菜单可用同名字段覆盖，不添加原生底部关闭按钮。
close-with-escape: true
# 全局材质隐藏，不改变原生布局、点击区域或悬停提示，不会腾出顶部/侧边空间。
# 隐藏所有原生 Dialog 的顶部警告图标。
hide-dialog-warning: false
# 隐藏共用原生滚动条贴图的界面滚动条；滚轮和拖动行为保留。
hide-scrollbar: false
# 修改上述开关后执行 /dialogmenu reload all，并让玩家接收新资源包。
text-scales: [0.8, 1, 2]
default-text-scale: 1
# 资源准备的参考倍率；个人倍率由 /dialogmenu scale 校准，在0.8..2.2内保存实际值。
canvas-scales: [0.8, 1, 2]
default-canvas-scale: 1
# 可选菜单入口；升级不会自动写入现有配置。
openers: {}
# 原版16色已内置；额外HEX色供文字和已开启染色的图片共用，总计最多256色。
# 例如 ['#123456']；新增颜色后执行 /dialogmenu reload all 并发布新资源包。
# 已准备颜色之间切换只需 reload yaml，不因改色重新接包。
text-colors: []
# 仅支持 RGBA 渲染，不由配置切换。
craftengine-auto-reload: true
# 开启后直接复用编译缓存，加快开服菜单加载和 ce reload，但不会自动重载菜单或资源。
# 默认关闭：开服恢复缓存后仅 reload yaml；手动 ce reload 时准备现用资源。
# 两种模式开服都不自动 reload all；无有效缓存时请手动 /dialogmenu reload all。
reuse-compiled-cache: false
# 外部管线在最终包发布成功后，通过API或publish命令提交待发布版本。
resource-pack-external-publisher: false
craftengine-resources: ../CraftEngine/resources
# 仅旧image/item ID需要列出定义文件，相对于craftengine-resources；新PNG路径不需要。
craftengine-definitions: []
# 独立资源任务并行数，1..8；默认最多4路，并预留1个逻辑处理器。
# resource-build-threads: 4
# 每个构建线程的平均CPU预算，1..100；不是进程总CPU上限，不限制GC或CraftEngine。
resource-build-cpu-percent: 80
reload-progress-bossbar: true
