plugins {
    id 'java'
}

group = 'dev.dialogmenu'
version = providers.gradleProperty('version').get()

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://repo.skriptlang.org/releases' }
}

def localClasspath = System.getenv('DIALOGMENU_LOCAL_CLASSPATH')
dependencies {
    if (localClasspath) {
        compileOnly files(localClasspath.split(java.io.File.pathSeparator).collect { file(it) })
    } else {
        compileOnly 'io.papermc.paper:paper-api:1.21.7-R0.1-SNAPSHOT'
        compileOnly 'net.kyori:adventure-nbt:4.24.0'
        compileOnly('com.github.SkriptLang:Skript:2.12.2') {
            transitive = false
        }
    }
    testImplementation files(configurations.compileClasspath)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(providers.gradleProperty('javaVersion').getOrElse('21').toInteger())
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    exclude 'glyphs.bin.gz', 'vanilla-icons.zip', 'vanilla-inventory.zip'
    inputs.property('version', project.version)
    from('tools/models') {
        into 'models/compiler'
        exclude '**/__pycache__/**', '**/test_*.py'
    }
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

processTestResources {
    from('src/main/resources') {
        include 'glyphs.bin.gz', 'vanilla-icons.zip', 'vanilla-inventory.zip'
    }
}

tasks.register('assetLibrary', Sync) {
    from('src/main/resources') {
        include 'glyphs.bin.gz', 'vanilla-icons.zip', 'vanilla-inventory.zip', 'vanilla-assets.properties'
    }
    from('src/main/resources/licenses/unifont-LICENSE.txt')
    from('LICENSE')
    into layout.buildDirectory.dir('asset-library')
}
assemble.dependsOn assetLibrary

jar {
    archiveFileName = "DialogMenu-${project.version}.jar"
    from('LICENSE') {
        into 'META-INF'
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.dialogmenu.ResourceRegressionTests'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'dialogmenu.test.directory', layout.buildDirectory.dir('regression-data').get().asFile.absolutePath
}
check.dependsOn regressionTest
// 回归入口为上面的JavaExec，无需为main式检查引入测试框架。
test.failOnNoDiscoveredTests = false

// 独立的性能测试源码集；JMH 和测试素材不会进入发布 JAR。
sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}
dependencies {
    def offlineBench = System.getenv('DIALOGMENU_BENCHMARK_CLASSPATH')
    if (offlineBench) {
        benchmarkImplementation files(offlineBench.split(java.io.File.pathSeparator))
        benchmarkAnnotationProcessor files(offlineBench.split(java.io.File.pathSeparator))
    } else {
        benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
        benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    }
}
processBenchmarkResources {
    from('src/main/resources') {
        include 'glyphs.bin.gz', 'vanilla-icons.zip', 'vanilla-inventory.zip'
    }
}
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Run opt-in offline JMH benchmarks (not included in check).'
    dependsOn benchmarkClasses
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    systemProperty 'java.awt.headless', 'true'
    def destination = providers.gradleProperty('benchmarkOutput').getOrElse('build/reports/benchmarks/results.json')
    doFirst { file(destination).absoluteFile.parentFile.mkdirs() }
    args '-prof', 'gc', '-rf', 'json', '-rff', destination, '-foe', 'true'
    args providers.gradleProperty('benchmarkArgs').getOrElse('dev.dialogmenu.*Benchmark').split(' ').findAll { it }
}
tasks.register('benchmarkSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify benchmark fixtures and observable results without timing assertions.'
    dependsOn benchmarkClasses
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'dev.dialogmenu.BenchmarkSmoke'
    systemProperty 'java.awt.headless', 'true'
}
tasks.register('benchmarkClasspath') {
    dependsOn benchmarkClasses
    doLast {
        def destination = layout.buildDirectory.file('benchmark/classpath.txt').get().asFile
        destination.parentFile.mkdirs()
        destination.text = sourceSets.benchmark.runtimeClasspath.asPath
    }
}
